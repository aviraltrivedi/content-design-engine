<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content & Design Engine | Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.3);
            --text: #f8fafc;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Subtle Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, transparent 50%);
            opacity: 0.3;
            z-index: -1;
            filter: blur(80px);
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .upload-zone {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            margin-bottom: 60px;
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(129, 140, 248, 0.05);
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .upload-zone h3 { font-size: 1.5rem; margin-bottom: 10px; }
        .upload-zone p { color: var(--text-dim); }

        .hidden-input { display: none; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1240px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            padding: 30px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card h2 { font-size: 1.25rem; margin: 0; color: var(--accent); }

        .preview-container {
            width: 100%;
            aspect-ratio: 16/10;
            background: #000;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .empty-state { color: var(--text-dim); font-style: italic; font-size: 0.9rem; }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .log-table th { text-align: left; color: var(--text-dim); padding-bottom: 10px; }
        .log-table td { padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.05); }

        .score-badge {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(100px);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateY(0); }

    </style>
</head>
<body>

    <header>
        <h1>Design Orchestrator</h1>
        <p style="color: var(--text-dim); margin-top: 10px; font-size: 1.1rem;">Automated Content Engine & Quality Analyzer</p>
    </header>

    <div class="upload-zone" id="drop-zone">
        <h3>Drop Assets Here</h3>
        <p>Support for JPG, PNG, MP4. Drop 4+ images for LinkedIn Collages.</p>
        <input type="file" id="file-input" class="hidden-input" multiple accept="image/*,video/*">
    </div>

    <div class="grid">
        <!-- Live Previews -->
        <div class="card">
            <h2>Latest Transformations</h2>
            <div id="output-previews" style="display: flex; flex-direction: column; gap: 15px;">
                <div class="preview-container"><div class="empty-state">Waiting for engine output...</div></div>
            </div>
        </div>

        <!-- Rationale Log -->
        <div class="card">
            <h2>Live Scoring Pipeline</h2>
            <table class="log-table">
                <thead>
                    <tr>
                        <th>Asset</th>
                        <th>Score</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <tr><td colspan="3" class="empty-state">No activity detected.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="toast" id="toast">Files uploaded! Processing...</div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const toast = document.getElementById('toast');

        // Drag & Drop
        dropZone.onclick = () => fileInput.click();
        
        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        };

        dropZone.ondragleave = () => dropZone.classList.remove('dragover');

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        };

        fileInput.onchange = () => handleFiles(fileInput.files);

        async function handleFiles(files) {
            if (files.length === 0) return;
            
            const formData = new FormData();
            for (let file of files) {
                formData.append('assets', file);
            }

            toast.classList.add('show');
            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                console.log(data);
                setTimeout(() => toast.classList.remove('show'), 3000);
            } catch (err) {
                console.error(err);
            }
        }

        // Live Update Logic
        async function fetchResults() {
            try {
                const res = await fetch('/results');
                const data = await res.json();
                
                // Update Logs
                if (data.logs && data.logs.length > 0) {
                    const logBody = document.getElementById('log-body');
                    logBody.innerHTML = data.logs.reverse().map(log => `
                        <tr>
                            <td style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${log.file}</td>
                            <td><span class="score-badge">${log.score}</span></td>
                            <td>${log.isLowConfidence ? '⚠️ Flagged' : '✅ Approved'}</td>
                        </tr>
                    `).join('');
                }

                // Update Output Previews
                if (data.latestOutput && data.latestOutput.length > 0) {
                    const previews = document.getElementById('output-previews');
                    previews.innerHTML = data.latestOutput.map(file => {
                        const ext = file.split('.').pop().toLowerCase();
                        if (['png', 'jpg', 'jpeg'].includes(ext)) {
                            return `<div class="preview-container"><img src="/output/${file}" alt="Output"></div>`;
                        } else if (ext === 'mp4') {
                            return `<div class="preview-container"><video src="/output/${file}" autoplay loop muted style="width:100%; height:100%; object-fit:cover;"></video></div>`;
                        }
                        return '';
                    }).join('');
                }
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        setInterval(fetchResults, 3000);
        fetchResults(); // Initial load
    </script>
</body>
</html>
